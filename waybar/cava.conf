# Config de cava para el visualizador de waybar (custom/cava).
# Salida raw ASCII: una línea por frame con un valor 0-7 por barra, separados
# por ";". media-cava.sh la traduce a caracteres de bloque.

[general]
# 30fps alcanza de sobra para 10 barras y es la mitad de redibujos que 60
framerate = 30
bars = 10

# autosens sube la ganancia hasta que el pico toca el techo. Solo, con música
# masterizada fuerte, deja las barras clavadas en el máximo el 68% del tiempo
# (medido) y se ve un bloque sólido. Se lo deja activo porque es lo que hace que
# el visualizador siga funcionando si cambiás el volumen del sistema, pero con
# la sensibilidad bajada para que el rango 0-7 se use entero.
autosens = 1
sensitivity = 40

[input]
# pulse, no pipewire: cava 0.7.4 (el de noble) todavía no trae backend propio
# de pipewire, pero pipewire-pulse expone igual el monitor de salida
method = pulse
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 7

[smoothing]
# integral/gravity suavizan subida y caída; monstercat reparte algo de energía a
# las barras vecinas para que el movimiento no se vea escalonado
integral = 70
gravity = 100
monstercat = 1.5
