# Font
font_family Comic Sans MS
bold_font Comic Sans MS Bold
italic_font Comic Sans MS Italic
bold_italic_font Comic Sans MS Bold Italic
font_size 10

# Background
# background #000000
background_opacity 0.9
#background_image ~/.config/kitty/wallpapers/desert_dark.png
#background_image_layout cscaled
background_tint 0.6

# Window
hide_window_decorations no
remember_window_position yes
remember_window_size yes

# Tab Bar
tab_bar_style fade
tab_bar_align center

include no-preference-theme.auto.conf

tab_bar_min_tabs 1
confirm_os_window_close 0
