tab_bar_style powerline

# Background
background #000000
background_opacity 0.3
#background_image ~/.config/kitty/wallpapers/desert_light.png
background_image ~/.config/kitty/wallpapers/the_dark_side.png
background_image_layout cscaled
background_tint 0.7

# Window
hide_window_decorations no
remember_window_position yes
remember_window_size yes

# Tab Bar
tab_bar_style fade
tab_bar_align center
