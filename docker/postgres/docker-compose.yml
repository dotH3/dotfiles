# Stack de PostgreSQL para desarrollo.
# El nombre del proyecto (name:) fija el prefijo del volumen, asi que la ruta
# del directorio se puede mover sin perder los datos.
name: pgdev
services:
  db:
    image: postgres:16
    container_name: pgdev-db
    environment:
      POSTGRES_DB: devdb
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpassword
    ports:
      - '5433:5432'    # <-- Host:Contenedor (5433 para no chocar con un postgres local)
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U devuser -d devdb']
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  pg_data:
